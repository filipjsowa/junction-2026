# Local development only (docker compose loads this file automatically).
# Your code is mounted into the container, so edits apply without rebuilding.
services:
  db:
    ports:
      - "127.0.0.1:3306:3306"

  api:
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
