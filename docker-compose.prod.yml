# VPS only: `make prod` (= docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build).
# Caddy serves the app on ports 80/443 and gets an HTTPS certificate for DOMAIN automatically.
services:
  api:
    volumes:
      - ./data:/app/data:ro   # so `make load` works with files copied to the VPS

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
